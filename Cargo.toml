[package]
name = "pdf-cli"
version = "0.1.0"
edition = "2021"
description = "AI-native PDF toolkit CLI — designed for agent interaction"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
lopdf = "0.36"
image = "0.25"
pdf-extract = "0.10"
tempfile = "3"
pdfium-render = { version = "0.8", features = ["image"] }

[profile.release]
opt-level = 3
lto = true
strip = true
